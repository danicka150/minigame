name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget \
            python3-pip python3-venv \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Установить Buildozer
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user buildozer
          python3 -m pip install --user "cython==0.29.34"

      - name: Подготовить Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd "$SDK"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O tools.zip

          unzip -q tools.zip -d cmdline-tools

          mv cmdline-tools/cmdline-tools cmdline-tools/latest

          # Buildozer ищет старый путь tools/bin
          mkdir -p "$SDK/tools"

          ln -sf "$SDK/cmdline-tools/latest/bin" "$SDK/tools/bin"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"

      - name: Принять лицензии Android
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | "$SDK/tools/bin/sdkmanager" --licenses || true

      - name: Установить Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Собрать APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          buildozer android debug

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Android APK
          path: bin/*.apk
